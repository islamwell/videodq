services:
  # Backend API Service
  - type: web
    name: videodq-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false  # Add via dashboard
      - key: JWT_SECRET
        generateValue: true  # Auto-generate secure secret
      - key: JWT_REFRESH_SECRET
        generateValue: true  # Auto-generate secure secret
      - key: ALLOWED_ORIGINS
        sync: false  # Add via dashboard
    healthCheckPath: /api/health
    autoDeploy: true

  # Optional: MongoDB Database (Paid - $7/month)
  # Uncomment if you need hosted MongoDB
